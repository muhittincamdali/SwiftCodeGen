# XcodeGen spec for SyncDemo.xcodeproj. The project file is committed, so XcodeGen is only needed
# after changing this file: run `xcodegen` in this folder.
name: SyncDemo
options:
  bundleIdPrefix: io.github.muhittincamdali
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwiftCodeGen:
    path: ../..
targets:
  SyncDemo:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [SyncDemo]
    dependencies:
      - package: SwiftCodeGen
        product: SwiftCodeGen
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # The settings of a new Xcode 26+ app: code is on the main actor unless it says otherwise.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sync Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Sign to run locally on the Mac; the simulator needs no signing.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  SyncDemo:
    build:
      targets:
        SyncDemo: all
    run:
      config: Debug
