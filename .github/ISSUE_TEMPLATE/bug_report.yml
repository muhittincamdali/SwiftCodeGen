name: Bug report
description: Something in SwiftCodeGen does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Code that shows it
      description: The smallest class or test that reproduces the problem. For a wrong expansion, add what Xcode shows under Expand Macro.
      render: swift
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SwiftCodeGen version
      description: A release tag or a commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Xcode, Swift and OS versions
      description: For example "Xcode 26.6, Swift 6.2, iOS 26.5 simulator".
    validations:
      required: true
