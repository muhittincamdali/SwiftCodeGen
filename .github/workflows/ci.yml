# Managed by the repository kit (muhittincamdali/.github). Edit the inputs, keep the structure.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  swift:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/swift-ci.yml@59e72703c617cfab0c12482c477e706c485ed683 # v1.1.1
    with:
      platforms: '["iOS","macOS","tvOS","watchOS","visionOS"]'
      scheme: SwiftCodeGen
      # The macro tests are built for the Mac (macros run in the compiler), so a plain
      # `xcodebuild test` on a simulator cannot load their bundle. examples.yml runs the
      # runtime tests on an iOS simulator with -only-testing instead.
      test-on-simulator: false
